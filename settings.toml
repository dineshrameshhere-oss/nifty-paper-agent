[paper]
starting_capital_paise = 1000000 # ₹10,000.00
max_trade_value_paise = 200000   # ₹2,000.00
max_open_positions = 3
max_daily_loss_paise = 50000     # ₹500.00
max_position_quantity = 50
allow_short = false
spread_bps = 10
slippage_bps = 5
fee_bps = 3
partial_fill_fraction = 1.0

[analysis]
mode = "hybrid"
bar_minutes = 5
stale_after_seconds = 15
worker_count = 10
subleader_count = 2
driver_count = 1
worker_timeout_seconds = 25

[llm]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
worker_model = "gemini-3.1-flash-lite"
subleader_model = "gemini-3.1-flash-lite"
driver_model = "gemini-3.1-flash-lite"
max_concurrent_requests = 10
requests_per_minute = 5
max_tokens_worker = 400
max_tokens_subleader = 500
max_tokens_driver = 600
temperature = 0.2


[paper]
starting_capital_paise = 1000000 # ₹10,000.00
max_trade_value_paise = 200000   # ₹2,000.00
max_open_positions = 3
max_daily_loss_paise = 50000     # ₹500.00
max_position_quantity = 50
allow_short = false
spread_bps = 10
slippage_bps = 5
fee_bps = 3
partial_fill_fraction = 1.0

[analysis]
mode = "hybrid"
bar_minutes = 5
stale_after_seconds = 15
max_debate_rounds = 1
max_risk_discuss_rounds = 1
reflection_enabled = true
max_memory_results = 5
stage_timeout_seconds = 30

[llm]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
quick_think_model = "gemini-3.1-flash-lite"
deep_think_model = "gemini-3.1-flash-lite"
fallback_model = "gemini-3.5-flash-lite"
max_concurrent_requests = 10
requests_per_minute = 5
max_tokens_analyst = 500
max_tokens_debate = 600
max_tokens_decision = 800
temperature = 0.2
use_offline_deterministic = false

